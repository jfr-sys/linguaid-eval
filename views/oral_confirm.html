<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confirmer le créneau oral — Linguaid Eval</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; background: #f8fafc; margin: 0; color: #1f2937; }
  .wrap { max-width: 520px; margin: 32px auto; padding: 0 16px; }
  .brand { color: #1F4E79; font-weight: 700; font-size: 18px; margin-bottom: 18px; }
  .card { background: white; border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.06); padding: 22px 24px; }
  h1 { font-size: 19px; margin: 0 0 4px; }
  .sub { color: #64748b; font-size: 13px; margin-bottom: 18px; }
  label { display: block; font-size: 12px; font-weight: 600; color: #475569; margin: 14px 0 4px; text-transform: uppercase; letter-spacing: .04em; }
  select, input { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; background: white; }
  .row { display: flex; gap: 10px; } .row > div { flex: 1; }
  .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 18px; }
  .primary { background: #7c3aed; color: white; } .primary:disabled { opacity: .5; cursor: default; }
  .ghost { background: white; color: #64748b; border: 1px solid #e2e8f0; margin-top: 10px; font-weight: 500; }
  .state { margin-top: 14px; padding: 10px 12px; border-radius: 8px; font-size: 13px; }
  .ok { background: #dcfce7; color: #166534; } .err { background: #fee2e2; color: #991b1b; } .info { background: #dbeafe; color: #1e40af; }
  .current { font-size: 13px; color: #92400e; background: #fef3c7; padding: 8px 12px; border-radius: 8px; margin-bottom: 8px; }
  a.link { color: #1F4E79; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">linguaid eval</div>
  <div class="card" id="card">
    <h1 id="title">Confirmer le créneau oral</h1>
    <div class="sub" id="sub">Chargement…</div>
    <div id="current" class="current" style="display:none"></div>
    <div id="form" style="display:none">
      <label>Évaluateur / évaluatrice</label>
      <select id="evaluator">
        <option value="">— Choisir —</option>
        <option>Hannah</option><option>Anna</option><option>Louise</option><option>Joss</option>
      </select>
      <div class="row">
        <div><label>Date de l’oral</label><input type="date" id="date"></div>
        <div><label>Heure</label><input type="time" id="time" step="300"></div>
      </div>
      <button class="btn primary" id="btnConfirm" onclick="submit('confirm')">✅ Confirmer le créneau</button>
      <button class="btn ghost" id="btnNo" onclick="submit('not_booked')">Pas encore réservé — l’apprenant n’a pas répondu</button>
      <button class="btn ghost" id="btnCancel" onclick="submit('cancel')" style="display:none">Annuler la réservation</button>
    </div>
    <div id="state" class="state" style="display:none"></div>
    <div id="after" style="display:none;margin-top:14px;font-size:13px">
      Le jour J : <a class="link" id="oralLink" href="#">ouvrir le formulaire d’évaluation orale →</a>
    </div>
  </div>
</div>
<script>
  var token = location.pathname.split('/').pop();
  var q = new URLSearchParams(location.search);
  var data = null;
  function el(id){ return document.getElementById(id); }
  function show(id, on){ el(id).style.display = on ? '' : 'none'; }
  function state(cls, msg){ var s = el('state'); s.className = 'state ' + cls; s.textContent = msg; s.style.display = ''; }

  fetch('/oral/confirm-data/' + token).then(function(r){ return r.json(); }).then(function(d){
    if (d.error) { el('sub').textContent = 'Lien invalide ou expiré.'; return; }
    data = d;
    el('title').textContent = 'Oral de ' + d.name;
    el('sub').textContent = (d.jobtitle ? d.jobtitle + ' · ' : '') + (d.company || '') + (d.writtenLevel ? ' · écrit ' + d.writtenLevel : '');
    var ev = q.get('e') || d.evaluator || '';
    if (ev) el('evaluator').value = ev;
    el('oralLink').href = '/oral/' + token;
    if (d.oralDone) { state('ok', 'Oral déjà effectué' + (d.oralDoneDate ? ' le ' + d.oralDoneDate : '') + ' — rien à confirmer.'); show('after', false); return; }
    if (d.bookedAt) {
      el('current').textContent = 'Créneau actuellement enregistré : ' + (d.slotLabel || d.bookedAt) + (d.bookedWith ? ' avec ' + d.bookedWith : '') + ' — vous pouvez le modifier ci-dessous.';
      show('current', true); show('btnCancel', true);
      if (d.slotDate) el('date').value = d.slotDate;
      if (d.slotTime) el('time').value = d.slotTime;
    }
    show('form', true); show('after', true);
  }).catch(function(){ el('sub').textContent = 'Erreur réseau.'; });

  function submit(action) {
    var ev = el('evaluator').value, date = el('date').value, time = el('time').value;
    if (action === 'confirm') {
      if (!ev) return state('err', 'Choisissez l’évaluateur.');
      if (!date) return state('err', 'Indiquez la date de l’oral.');
    }
    ['btnConfirm','btnNo','btnCancel'].forEach(function(id){ el(id).disabled = true; });
    fetch('/oral/confirm/' + token, { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: action, evaluator: ev, date: date, time: time }) })
    .then(function(r){ return r.json(); })
    .then(function(d){
      ['btnConfirm','btnNo','btnCancel'].forEach(function(id){ el(id).disabled = false; });
      if (!d.ok) return state('err', d.error || 'Erreur.');
      if (action === 'confirm') { state('ok', 'Merci ! Créneau enregistré : ' + d.slotLabel + ' avec ' + d.evaluator + '. Joss le voit maintenant sur la fiche.'); show('form', false); }
      else if (action === 'cancel') { state('info', 'Réservation annulée. Le candidat repasse « en attente de réservation ».'); el('current').style.display = 'none'; show('btnCancel', false); }
      else { state('info', 'Noté : pas encore de réservation. Une relance sera proposée à Joss.'); }
    })
    .catch(function(){ ['btnConfirm','btnNo','btnCancel'].forEach(function(id){ el(id).disabled = false; }); state('err', 'Erreur réseau.'); });
  }
</script>
</body>
</html>
